<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DriverHub</title>
<meta name="theme-color" content="#0F1115">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #0F1115;
  --bg-elevated: rgba(255,255,255,0.055);
  --card: rgba(255,255,255,0.07);
  --card-hover: rgba(255,255,255,0.1);
  --border: rgba(255,255,255,0.1);
  --text: #F8F7F4;
  --muted: #9AA0A6;
  --accent: #34E0C8;
  --accent-soft: rgba(52,224,200,0.15);
  --on-accent: #0A0E12;
  --danger: #FF6B6B;
  --danger-soft: rgba(255,107,107,0.15);
  --success: #4ADE80;
  --glass: rgba(18,20,26,0.78);
  --shadow: 0 8px 32px -8px rgba(0,0,0,0.45);
  --radius: 18px;
  --radius-sm: 12px;
  --glow: 0.65;
}
html[data-theme=light] {
  --bg: #F7F5F0;
  --bg-elevated: rgba(255,255,255,0.8);
  --card: rgba(255,255,255,0.92);
  --card-hover: #fff;
  --border: rgba(0,0,0,0.08);
  --text: #1A1A1A;
  --muted: #6B6B6B;
  --accent: #0D9488;
  --accent-soft: rgba(13,148,136,0.12);
  --on-accent: #fff;
  --glass: rgba(255,255,255,0.85);
  --shadow: 0 8px 32px -12px rgba(0,0,0,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { overflow-x: clip; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  padding: 0 16px calc(96px + env(safe-area-inset-bottom));
  min-height: 100dvh;
}
body::before {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(40% 30% at 15% 10%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 65%),
    radial-gradient(35% 25% at 90% 45%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
    radial-gradient(30% 20% at 30% 95%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 55%);
  opacity: var(--glow);
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0 16px;
}
h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.6px;
}
.sub { font-size: 12px; color: var(--muted); font-weight: 600; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(20px);
  transition: background .2s;
}
.card:active { background: var(--card-hover); }

.t {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.r {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
  font-size: 14px;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
}
.r:last-child { border: 0; }
.r span:first-child { color: var(--muted); font-weight: 500; }
.big {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -1.5px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.pos { color: var(--accent); }
.neg { color: var(--danger); }

button {
  font: inherit;
  color: inherit;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .15s cubic-bezier(.2,1.2,.4,1), opacity .12s, background .15s;
}
button:active, [data-a]:active { transform: scale(.96); }
.b {
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 75%, #000));
  color: var(--on-accent);
  font-weight: 800;
  border-radius: 16px;
  padding: 14px 16px;
  width: 100%;
  font-size: 15px;
  box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 30%, transparent);
}
.k {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  font-weight: 700;
  font-size: 13px;
  min-width: 0;
  text-align: center;
}
.k small { font-size: 11px; color: var(--muted); font-weight: 600; display: block; margin-top: 2px; }
.k.on {
  background: var(--accent);
  color: var(--on-accent);
  border-color: transparent;
}
.k.on small { color: var(--on-accent); }

.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; margin-bottom: 10px; }
.f label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
  margin-bottom: 6px;
}
.st {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-elevated);
  border-radius: 14px;
  padding: 4px;
  border: 1px solid var(--border);
}
.st button {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--card);
  font-size: 18px;
  font-weight: 700;
  flex: 0 0 auto;
}
input, select {
  font: inherit;
  font-size: 16px;
  color: var(--text);
  background: transparent;
  border: 0;
  border-radius: 10px;
  padding: 10px;
  width: 100%;
  min-width: 0;
  text-align: center;
  font-weight: 700;
}
.st input { padding: 8px 4px; }
input:focus, select:focus { outline: none; }

nav {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 50;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 6px;
  border-radius: 28px;
  background: var(--glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(28px) saturate(1.8);
  box-shadow: 0 12px 40px -10px rgba(0,0,0,0.5), inset 0 1px 0 var(--border);
}
nav button {
  background: none;
  border-radius: 22px;
  padding: 8px 0 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: center;
  position: relative;
}
nav button i { font-style: normal; font-size: 20px; }
nav button.on {
  background: var(--accent);
  color: var(--on-accent);
}
.bd {
  position: absolute;
  top: 2px;
  right: 8px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 9px;
  font-weight: 800;
  border-radius: 99px;
  padding: 1px 5px;
  min-width: 16px;
}
nav button.on .bd { background: var(--on-accent); color: var(--accent); }

.pgb {
  height: 10px;
  background: var(--bg-elevated);
  border-radius: 6px;
  overflow: hidden;
  margin: 8px 0;
}
.pgb div {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #fff));
  border-radius: 6px;
  transition: width .4s cubic-bezier(.2,.8,.3,1);
}
#ov {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: flex-end;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
}
.sh {
  width: 100%;
  background: var(--glass);
  backdrop-filter: blur(32px);
  border: 1px solid var(--border);
  border-radius: 28px 28px 0 0;
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  animation: sheetUp .28s cubic-bezier(.2,.9,.3,1);
  max-height: 88vh;
  overflow: auto;
}
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
#ts { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; z-index: 200; display: flex; justify-content: center; pointer-events: none; }
.to {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 12px 18px;
  font-weight: 700;
  font-size: 14px;
  max-width: 92%;
  backdrop-filter: blur(20px);
  animation: sheetUp .25s;
  pointer-events: auto;
  box-shadow: var(--shadow);
}
.vd {
  padding: 10px 12px;
  border-radius: 14px;
  font-weight: 800;
  font-size: 13px;
  margin: 8px 0;
}
.vd.vg { background: var(--accent-soft); color: var(--accent); }
.vd.vm { background: var(--bg-elevated); }
.vd.vx { background: var(--danger-soft); color: var(--danger); }
.hi {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.hi:last-child { border: 0; }
.hi > div { flex: 1; min-width: 0; }
.hi small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.x {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--bg-elevated);
  color: var(--muted);
  font-weight: 700;
}
details { border-top: 1px solid var(--border); padding: 4px 0; }
summary { padding: 10px 0; font-weight: 700; cursor: pointer; font-size: 14px; }
.page { animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cd {
  background: var(--bg-elevated);
  border-radius: 12px;
  padding: 8px 0;
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.cd small { display: block; font-size: 10px; color: var(--muted); font-weight: 600; }
.cd.off { background: var(--danger-soft); color: var(--danger); }
.cd.td { outline: 2px solid var(--accent); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 70px; }
.bars div { flex: 1; background: var(--bg-elevated); border-radius: 4px 4px 0 0; min-height: 3px; }
.bars div.top { background: var(--accent); }
.warn { font-size: 12px; color: var(--muted); margin: 4px 0 8px; line-height: 1.4; }
.pal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pal button { background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--muted); padding: 6px 0; }
.pal i { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--border); }
.pal button.on { color: var(--text); }
.pal button.on i { border-color: var(--text); }
.dc > summary { list-style: none; display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 0; }
.dc > summary::-webkit-details-marker { display: none; }
.dc[open] > summary { margin-bottom: 14px; }
body.kb nav { display: none; }
body.kb { padding-bottom: 48vh !important; }
#res { min-height: 280px; }
#cmp { min-height: 120px; }
.fl { animation: flash .5s ease; }
@keyframes flash { 0% { transform: scale(1.06); filter: brightness(1.4); } 100% { transform: none; filter: none; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>DriverHub</h1>
    <div class="sub" id="hs"></div>
  </div>
  <button class="x" data-a="theme" style="font-size:16px">🌗</button>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="ov"></div>
<div id="ts"></div>
<input type="file" id="imp" accept=".json" style="display:none">
<script>
// ==================== CORE LOGIC (збережено та очищено) ====================
const tg = window.Telegram && Telegram.WebApp;
tg && (tg.expand(), tg.ready());
try { tg && tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e) {}
document.addEventListener('touchstart', () => { window.scrollY <= 0 && window.scrollTo(0, 1); }, { passive: true });

const $ = s => document.querySelector(s);
const m = n => Math.round(n || 0).toLocaleString('uk-UA').replace(/[\u00a0\u202f]/g, ' ');
const ld = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) || f; } catch(e) { return f; } };
const sv = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const hap = t => { try { const h = tg.HapticFeedback; t === 's' ? h.selectionChanged() : t === 'ok' ? h.notificationOccurred('success') : t === 'e' ? h.notificationOccurred('error') : h.impactOccurred(t === 'm' ? 'medium' : 'light'); } catch(e) {} };
document.addEventListener('pointerdown', e => { const b = e.target.closest('button,[data-a]'); b && !b.disabled && hap(b.closest('nav') || b.classList.contains('k') ? 's' : b.classList.contains('b') ? 'm' : 'l'); }, { passive: true });

const toast = (t, k, a) => {
  hap(k === 'e' ? 'e' : 'ok');
  $('#ts').innerHTML = `<div class="to">${t}${a ? `<button class="u" data-a="${a[0]}" data-v="${a[1]}">${a[2]}</button>` : ''}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('#ts').innerHTML = '', a ? 5000 : 2200);
};

const K = { e: 'taxi_expenses_v22', t: 'taxi_tariffs_v22', d: 'taxi_daily_cash_data_v22', a: 'taxi_shift_archive_v1', p: 'taxi_platforms_v2', c: 'taxi_calc_v2' };
const T = (n, a, b, c, d, e, f) => ({ name: n, minPrice: a, minKm: b, perKmCity: c, perKmOut: d, perMin: e, stopPrice: f });
const DT = { standard: T('Стандарт', 95, 1.8, 30, 45, 3.5, 10), comfort: T('Комфорт', 100, 1.8, 35, 45, 4, 15), business: T('Бізнес', 120, 1.5, 40, 45, 5, 15), intercity: T('За місто', 100, 1.5, 30, 40, 4, 15) };
const DP = () => ({
  uklon: { name: 'Uklon', comm: 17, t: JSON.parse(JSON.stringify(DT)) },
  bolt: { name: 'Bolt', comm: 20, ph: 1, t: { econ: T('Економ', 90, 2, 22, 28, 3, 10), comf: T('Комфорт', 100, 2, 26, 32, 3.5, 10) } },
  uber: { name: 'Uber', comm: 25, ph: 1, t: { x: T('UberX', 85, 2, 21, 27, 3, 10), comf: T('Comfort', 100, 2, 25, 31, 3.5, 10) } }
});

const E = Object.assign({ comm: 17, type: 'gas', cons: 14, price: 41.9, amort: 0, workMode: 'solo', rentVal: 0, splitPct: 10, taxRate: 5, fop: false, warRate: 1, esv: 1902.34, taxBase: 'afterComm', goalKm: 40, goalDay: 2000, planH: 10, accent: 'teal', autoReset: true, glow: 1, platNow: true, platOver: 23, taxType: 'none', taxYear: 2026, vat: false, vatRate: 20, vatLimit: 1000000, fixTax: 0 }, ld(K.e, {}));
const P = ld(K.p, null) || (() => { const p = DP(); p.uklon.comm = E.comm; Object.assign(p.uklon.t, ld(K.t, {})); return p; })();
const C = Object.assign({ km: 0, kmOut: 0, deliv: 0, empty: 0, wait: 0, stops: 0, coef: 1, tip: 0, offer: 0, pay: 'cash', pl: 'uklon', tr: 'standard' }, ld(K.c, {}));
const S = { per: 30, po: false };
let D, tab = 'trip';
const B = Object.assign({ target: 700, adj: null, off: [], mon: '' }, ld('taxi_brand_v2', {}));

const AC = {
  teal: ['Бірюза', '#34E0C8', '#0B9A8B', '#0F1115', '#F7F5F0'],
  sky: ['Небо', '#5DB9FF', '#1F7AD6', '#0F1115', '#F7F5F0'],
  indigo: ['Індиго', '#9AA6FF', '#4A5BD4', '#0F1115', '#F7F5F0'],
  violet: ['Фіолет', '#C792FF', '#8A3FD6', '#0F1115', '#F7F5F0'],
  rose: ['Рожевий', '#FF8FB0', '#D6406A', '#0F1115', '#F7F5F0'],
  coral: ['Корал', '#FF8570', '#D64A33', '#0F1115', '#F7F5F0'],
  orange: ['Мандарин', '#FFA24D', '#D9700A', '#0F1115', '#F7F5F0'],
  amber: ['Бурштин', '#FFC84A', '#D98E00', '#0F1115', '#F7F5F0'],
  lime: ['Лайм', '#BDEB5C', '#6A9F12', '#0F1115', '#F7F5F0'],
  mint: ['Мʼята', '#6BEBA6', '#0F9D5A', '#0F1115', '#F7F5F0']
};

if (E.glow === undefined) E.glow = 1;
if (E.platNow === undefined) E.platNow = true;
if (!E.platOver) E.platOver = 23;
if (!E.taxType) E.taxType = E.fop ? 'g3' : 'none';
if (!E.taxYear) E.taxYear = 2026;
if (E.vat === undefined) E.vat = false;
if (!E.vatRate) E.vatRate = 20;
if (!E.vatLimit) E.vatLimit = 1000000;
if (E.fixTax === undefined) E.fixTax = 0;

function applyAccent() {
  const d = document.documentElement.dataset.theme === 'dark' ? 0 : 1;
  const a = AC[E.accent] || AC.teal;
  const c = a[1 + d];
  const n = parseInt(c.slice(1), 16);
  const l = .299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255);
  const st = document.documentElement.style;
  st.setProperty('--accent', c);
  st.setProperty('--on-accent', l > 150 ? '#0A0E12' : '#fff');
  st.setProperty('--bg', a[3 + d]);
  st.setProperty('--glow', [0, .55, 1][E.glow] ?? .55);
}

const fixM = () => E.fop ? (+E.esv || 0) + (+E.fixTax || 0) : 0;
const platYtd = () => {
  const t = Date.now();
  if (platYtd.c && t - platYtd.c[0] < 2000) return platYtd.c[1];
  const y = new Date().getFullYear();
  const v = ld(K.a, []).filter(x => new Date(x.timestamp).getFullYear() === y && x.date !== D.date).reduce((a, x) => a + x.gross - x.comm, 0) + D.gross - D.comm;
  platYtd.c = [t, v];
  return v;
};
const taxOf = (g, comm, fuel, park) => {
  if (!E.fop) return 0;
  if (E.taxType === 'plat') return (E.platNow || Date.now() >= new Date(2027, 0, 1).getTime()) ? Math.max(0, g - comm) * ((platYtd() >= 834 * (E.mzp || 8647) ? E.platOver : E.taxRate) / 100) : 0;
  const v = E.vat ? 1 + (E.vatRate || 20) / 100 : 1;
  const gv = g / v;
  const base = E.taxBase === 'gross' ? gv : E.taxBase === 'profit' ? Math.max(0, gv - comm - fuel - park) : gv - comm;
  return base * (E.taxRate + E.warRate) / 100 + (E.vat ? g - gv : 0);
};
function taxPreset() {
  const y = E.taxYear === 2027;
  const mz = y ? 9546 : 8647;
  const t = E.taxType;
  E.mzp = mz;
  E.esv = +(mz * .22).toFixed(2);
  E.vat = false;
  if (t === 'g2') { E.taxRate = 0; E.warRate = 0; E.fixTax = +(mz * .3).toFixed(2); E.taxBase = 'gross'; }
  else if (t === 'g3') { E.taxRate = 5; E.warRate = 1; E.fixTax = 0; E.taxBase = 'afterComm'; }
  else if (t === 'plat') { E.taxRate = 10; E.warRate = 0; E.fixTax = 0; E.esv = 0; E.taxBase = 'afterComm'; }
  else if (t === 'gen') { E.taxRate = 18; E.warRate = 1.5; E.fixTax = 0; E.taxBase = 'profit'; }
  else { E.taxRate = 0; E.warRate = 0; E.fixTax = 0; E.esv = 0; }
}
function needG(pl, tot) {
  let lo = 0, hi = 1e5;
  for (let i = 0; i < 40; i++) {
    const mid = (lo + hi) / 2;
    fin(mid, pl, tot).eff >= E.goalKm ? hi = mid : lo = mid;
  }
  return hi;
}
const savePE = () => { sv(K.e, E); sv('taxi_brand_v2', B); sv(K.p, P); sv(K.t, P.uklon ? P.uklon.t : DT); };
const fixSel = () => { if (!P[C.pl]) C.pl = Object.keys(P)[0]; if (!P[C.pl].t[C.tr]) C.tr = Object.keys(P[C.pl].t)[0]; };
const root = { E, P, B };
const gp = p => p.split('.').reduce((o, k) => o[k], root);
const setPath = (p, v) => { const a = p.split('.'); const l = a.pop(); a.reduce((o, k) => o[k], root)[l] = v; };
const today = () => new Date().toLocaleDateString();
const hm = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const newDay = () => ({ date: today(), orders: 0, gross: 0, comm: 0, fuel: 0, extra: 0, park: 0, tax: 0, kmDv: 0, totalKm: 0, totalCash: 0, totalCard: 0, tips: 0, actualFuel: 0, history: [], shiftActive: false, shiftStart: null, shiftAccMs: 0, pl: {} });
const norm = d => { const n = Object.assign(newDay(), d); n.park = d.park ?? d.rent ?? 0; n.extra = d.extra ?? d.extraExp ?? 0; n.pl = d.pl || {}; return n; };
function loadDay() {
  const d = ld(K.d, null);
  if (d && d.date === today()) { D = norm(d); return; }
  if (d && d.orders) { D = norm(d); arc(); }
  D = newDay();
  sv(K.d, D);

  const rec = { date: D.date, orders: D.orders, gross: D.gross, comm: D.comm, fuel: D.fuel, actualFuel: D.actualFuel, tips: D.tips, extraExp: D.extra, rent: D.park + dRent(), tax: D.tax, net: dNet(), totalKm: D.totalKm, totalCash: D.totalCash, totalCard: D.totalCard, shiftHours: hrs(), cancelPct: 0, orderMinutes: 0, timestamp: Date.now(), hr, tr, pl: D.pl };

const fuelCost = km => km / 100 * E.cons * E.price + km * E.amort;
function fin(g, pl, tot) {
  const comm = g * pl.comm / 100;
  const fuel = fuelCost(tot);
  const park = E.workMode === 'split' ? (g - comm) * E.splitPct / 100 : 0;
  const tax = taxOf(g, comm, fuel, park);
  const net = g - comm - fuel - park - tax;
  return { g, comm, fuel, park, tax, net, tot, eff: tot ? net / tot : 0 };
}
function calc(t, pl, c) {
  let rem = t.minKm, xc = 0, xo = 0;
  if (c.km >= rem) { xc = c.km - rem; rem = 0; } else rem -= c.km;
  if (c.kmOut >= rem) xo = c.kmOut - rem;
  const g = (t.minPrice + xc * t.perKmCity + xo * t.perKmOut + c.wait * t.perMin + c.stops * t.stopPrice) * c.coef + c.tip;
  return fin(g, pl, c.km + c.kmOut + c.deliv + c.empty);
}
const kf = pl => {
  const c = pl.comm / 100, s = E.workMode === 'split' ? E.splitPct / 100 : 0, tr = E.fop ? (E.taxRate + E.warRate) / 100 : 0;
  return (1 - c) * (1 - s) - (E.taxBase === 'gross' ? tr : (1 - c) * tr);
};
function addTrip(r, plk, pay, tip, trip, dv) {

  pay === 'cash' ? D.totalCash += r.g : D.totalCard += r.g;
  const p = D.pl[plk] || (D.pl[plk] = { n: 0, g: 0, net: 0 });
  p.n++;
  p.g += r.g;
  p.net += r.net;
  const id = Date.now() + Math.random();
  D.history.unshift({ id, time: hm(), pay, pl: plk, g: r.g, net: r.net, km: r.tot, tip: tip || 0, trip: trip || 0, dv: dv || 0, r });
  save();
  return id;
}
function delItem(id) {
  const i = D.history.findIndex(t => t.id === id);
  if (i < 0) return;
  const t = D.history[i];
  if (t.x) { t.k === 'fuel' ? D.actualFuel = Math.max(0, D.actualFuel - t.amt) : D.extra -= t.amt; }
  else if (t.r) {

    D.tips -= t.tip || 0;

    const p = D.pl[t.pl];
    p && (p.n--, p.g -= r.g, p.net -= r.net);
  }
  D.history.splice(i, 1);
  save();
}

}

// ==================== FRAMEWORK ====================
const VIEW = { trip: vTrip, shift: vShift, brand: vBrand, stats: vStats, set: vSet };
const NAV = [['trip', '🧮', 'Поїздка'], ['shift', '⏱', 'Зміна'], ['brand', '🎯', 'Цілі'], ['stats', '📊', 'Звіти'], ['set', '⚙️', 'Опції']];

function show() {
  if (D.date !== today()) loadDay();
  fixSel();
  const y0 = window.scrollY;
  $('#app').innerHTML = VIEW[tab]();
  window.scrollTo(0, y0);
  tab === 'trip' && upTrip();
  $('#nav').innerHTML = NAV.map(n => `<button class="${n[0] === tab ? 'on' : ''}" data-a="tab" data-v="${n[0]}"><i>${n[1]}</i>${n[2]}${n[0] === 'shift' && D.orders ? `<b class="bd">${D.orders}</b>` : ''}</button>`).join('');
  hdr();
}
const hdr = () => { $('#hs').textContent = 'Сьогодні: ' + m(dNet()) + ' ₴ · ' + D.orders + ' поїздок'; };

function setC(k, v) {
  C[k] = k === 'coef' ? Math.max(1, Math.round(v * 10) / 10) : Math.max(0, Math.round(v * 10) / 10);
  const i = document.querySelector('[data-c="' + k + '"]');
  i && (i.value = C[k]);
  if (k === 'coef') document.querySelectorAll('[data-a=cf]').forEach(b => b.classList.toggle('on', +b.dataset.v === C.coef));
  upTrip();
}

const H = {
  tab: v => { tab = v; show(); window.scrollTo(0, 0); },
  theme: () => {
    const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = n;
    localStorage.setItem('taxi_theme', n);
    applyAccent();
    try { tg.setHeaderColor(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()); } catch (e) {}
  },
  pl: v => { S.po = false; C.pl = v; C.tr = Object.keys(P[v].t)[0]; sv(K.c, C); show(); },
  tr: v => { C.tr = v; sv(K.c, C); show(); },
  cf: v => setC('coef', +v),
  s: v => { const [k, s] = v.split(':'); setC(k, (+C[k] || 0) + +s); },
  pay: v => { C.pay = v; upTrip(); },
  pick: v => { const [a, b] = v.split(':'); C.pl = a; C.tr = b; sv(K.c, C); show(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  add: () => {
    const pl = P[C.pl];
    let r = calc(pl.t[C.tr], pl, C);
    if (C.offer > 0) r = fin(+C.offer, pl, r.tot);
    const snap = { ...C };
    const tid = addTrip(r, C.pl, C.pay, C.tip, C.km + C.kmOut, C.deliv + C.empty);
    H._snap = snap;
    if (E.autoReset !== false) { ['km', 'kmOut', 'deliv', 'empty', 'wait', 'stops', 'tip', 'offer'].forEach(k => C[k] = 0); C.coef = 1; sv(K.c, C); }
    toast('Записано · ' + m(r.g) + ' ₴ → чистими ' + m(r.net) + ' ₴', 'ok', ['undo', tid, 'Скасувати']);
    show();
    const b = $('.bd');
    b && b.classList.add('pop');
  },
  undo: v => { delItem(+v); H._snap && Object.assign(C, H._snap); sv(K.c, C); $('#ts').innerHTML = ''; hap('s'); show(); },
  mirror: () => setC('empty', C.km + C.kmOut),
  clr: () => { ['km', 'kmOut', 'deliv', 'empty', 'wait', 'stops', 'tip', 'offer'].forEach(k => C[k] = 0); C.coef = 1; sv(K.c, C); show(); },
  po: () => { S.po = !S.po; show(); },
  shift: () => {
    if (D.shiftActive) { D.shiftAccMs += Date.now() - D.shiftStart; D.shiftStart = null; D.shiftActive = false; }
    else { D.shiftActive = true; D.shiftStart = Date.now(); }
    save();
    show();
  },
  manual: async () => {
    const a = await ask('Поїздка вручну', [{ l: 'Сума, ₴' }, { l: 'Км поїздки' }, { l: 'Подача, км' }, { l: 'Платформа', o: Object.keys(P).map(k => [k, P[k].name]), v: C.pl }, { l: 'Оплата', o: [['cash', 'Готівка'], ['card', 'Картка']], v: C.pay }], 'Додати', v => ((+v[1] || 0) + (+v[2] || 0)).toFixed(1) + ' км');
    if (!a || !(+a[0] > 0)) return;
    const tr = +a[1] || 0, dv = +a[2] || 0;
    addTrip(fin(+a[0], P[a[3]], tr + dv), a[3], a[4], 0, tr, dv);
    toast('Додано · пробіг ' + tr.toFixed(1) + (dv ? ' + ' + dv.toFixed(1) : '') + ' км');
    show();
  },
  fuel: async () => {
    const a = await ask('Заправка', [{ l: 'Скільки залили, ₴' }]);
    if (!a || !(+a[0] > 0)) return;
    D.actualFuel += +a[0];
    D.history.unshift({ id: Date.now(), x: 1, k: 'fuel', name: '⛽ Заправка', amt: +a[0], time: hm() });
    save();
    show();
  },
  exp: async () => {
    const a = await ask('Витрата', [{ l: 'Назва', t: 's' }, { l: 'Сума, ₴' }]);
    if (!a || !(+a[1] > 0)) return;
    D.extra += +a[1];
    D.history.unshift({ id: Date.now(), x: 1, k: 'extra', name: '💸 ' + (a[0] || 'Витрата').replace(/[<>&]/g, ''), amt: +a[1], time: hm() });
    save();
    show();
  },
  del: async v => { if (await ask('Видалити запис?', [], 'Видалити')) { delItem(+v); show(); } },
  end: async () => { if (!await ask('Зміну буде збережено в архів і обнулено.', [], 'Завершити')) return; arc(); D = newDay(); sv(K.d, D); toast('Зміну завершено'); show(); },
  per: v => { S.per = +v; show(); },
  set: v => { const i = v.lastIndexOf(':'), p = v.slice(0, i), x = v.slice(i + 1); setPath(p, x === 'true' ? true : x === 'false' ? false : x); savePE(); applyAccent(); show(); },
  addtr: v => { P[v].t['t' + Date.now()] = T('Новий тариф', 90, 1.5, 25, 35, 3, 10); savePE(); show(); },
  deltr: v => { const [a, b] = v.split(':'); if (Object.keys(P[a].t).length < 2) return toast('Лишіть хоча б один тариф', 'e'); delete P[a].t[b]; savePE(); show(); },
  delpl: async v => { if (Object.keys(P).length < 2) return toast('Лишіть хоча б одну платформу', 'e'); if (!await ask('Видалити «' + P[v].name + '»?', [], 'Видалити')) return; delete P[v]; savePE(); show(); },
  addpl: async () => {
    const a = await ask('Нова платформа', [{ l: 'Назва', t: 's' }, { l: 'Комісія, %' }]);
    if (!a || !a[0].trim()) return;
    P['p' + Date.now()] = { name: a[0].trim().slice(0, 20).replace(/[<>&]/g, ''), comm: +a[1] || 20, t: { s: T('Стандарт', 90, 1.5, 25, 35, 3, 10) } };
    savePE();

  for (const w of top) { let mm = w.s.match(/^(\d{2,4})(?:[₴Ђ€$&?]|грн)?$/); if (!mm || w.s.includes('.')) continue; const nx = t.find(q => q !== w && Math.abs(q.cy - w.cy) < (w.y1 - w.y0) * .8 && q.x0 >= w.x1 - 6 && q.x0 - w.x1 < (w.y1 - w.y0) * 1.6 && /^([₴Ђ€$&?]|грн|uah)$/i.test(q.s)); if (nx || /[₴Ђ€$&?]|грн/.test(w.s)) { price = +mm[1]; pw = w; break; } }
  if (!price) { const c = top.filter(w => /^\d{2,4}$/.test(w.s) && (!kms[0] || w.x0 < kms[0].x)); c.sort((a, b) => (b.y1 - b.y0) - (a.y1 - a.y0)); c[0] && (price = +c[0].s, pw = c[0]); }
  let pl = null, tr = null;
  const low = t.map(w => w.s.toLowerCase());
  outer: for (const pk of [C.pl, ...Object.keys(P).filter(k => k !== C.pl)]) for (const tk of Object.keys(P[pk].t)) if (low.includes(P[pk].t[tk].name.toLowerCase())) { pl = pk; tr = tk; break outer; }
  let pay = 'cash';
  try { if (pw) { const g = cv.getContext('2d'), x = Math.max(0, Math.round(pw.x0)), y = Math.max(0, Math.round(pw.y0 - 14)), d = g.getImageData(x, y, Math.max(2, Math.round(pw.x1 - pw.x0)), 8).data; let r = 0, gg = 0, b = 0, n = d.length / 4; for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; } r /= n; gg /= n; b /= n; if (b > 135 && gg > 105 && r < 110 && b >= gg * .95) pay = 'card'; } } catch (e) {}

}
async function ocrFile(f) {
  if (ocrBusy) return;
  ocrBusy = true;
  try {
    toast('⏳ Розпізнаю скрін…');
    let cv;
    try { const bm = await createImageBitmap(f); const k = Math.min(1, 1100 / bm.width); cv = document.createElement('canvas'); cv.width = Math.round(bm.width * k); cv.height = Math.round(bm.height * k); cv.getContext('2d').drawImage(bm, 0, 0, cv.width, cv.height); } catch (e) { return toast('Не вдалось відкрити зображення', 'e'); }
    let words;
    try { const w = await ocrWorker(); const r = await w.recognize(cv); words = r.data.words || []; } catch (e) { return toast('OCR недоступний. Спробуйте «З буфера»', 'e'); }
    const o = ocrParse(words, cv);
    if (!o.price && !o.km) return toast('Не вдалось знайти суму й км', 'e');
    const opts = [];
    Object.keys(P).forEach(pk => Object.keys(P[pk].t).forEach(tk => opts.push([pk + ':' + tk, P[pk].name + ' · ' + P[pk].t[tk].name])));
    const a = await ask('Розпізнано — перевірте', [{ l: 'Ціна, ₴', v: o.price || '' }, { l: 'Км маршруту', v: o.km || '' }, { l: 'Подача, км', v: o.deliv || '' }, { l: 'Тариф', o: opts, v: (o.pl || C.pl) + ':' + (o.tr || C.tr) }, { l: 'Оплата', o: [['cash', 'Готівка'], ['card', 'Картка']], v: o.pay }], 'У калькулятор', v => ((+v[1] || 0) + (+v[2] || 0)).toFixed(2) + ' км');
    if (!a) return;
    const [pl, tr] = a[3].split(':');
    Object.assign(C, { pl, tr, km: +a[1] || 0, kmOut: 0, deliv: +a[2] || 0, empty: 0, wait: 0, stops: 0, coef: 1, tip: 0, offer: +a[0] || 0, pay: a[4] });
    sv(K.c, C);
    H.tab('trip');
    toast('Підставлено');
  } finally { ocrBusy = false; }
}
{ const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*'; f.id = 'ocrf'; f.style.display = 'none'; f.onchange = e => { const x = e.target.files[0]; e.target.value = ''; x && ocrFile(x); }; document.body.appendChild(f); }
