<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DriverHub</title>
<meta name="theme-color" content="#2A2D34">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html[data-theme=dark]{--bg:#2A2D34;--card:rgba(255,255,255,.075);--bd:rgba(255,255,255,.14);--tx:#F6F3EC;--mu:#ABAEB6;--ac:#FFC85A;--inn:rgba(255,255,255,.08);--gl:rgba(46,49,57,.84);--bad:#FF8478;--on:#14110a}
html[data-theme=light]{--bg:#F5F1E8;--card:rgba(255,255,255,.72);--bd:rgba(255,255,255,.95);--tx:#26211A;--mu:#7A7263;--ac:#D98E00;--inn:rgba(60,40,0,.06);--gl:rgba(255,255,255,.88);--bad:#D4453C;--on:#14110a}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip;overscroll-behavior-x:none}
body{background:var(--bg);color:var(--tx);padding:0 12px calc(88px + env(safe-area-inset-bottom));font-size:14px}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;background:radial-gradient(38% 26% at 12% 8%,color-mix(in srgb,var(--ac) 28%,transparent),transparent 70%),radial-gradient(34% 26% at 92% 40%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 70%)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 8px}
h1{font-size:19px;letter-spacing:-.5px}.sub{font-size:11px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:11px 12px;margin-bottom:8px;box-shadow:inset 0 1px 0 var(--bd)}
.t{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mu);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.r{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px;font-weight:600;border-bottom:1px solid var(--bd)}.r:last-child{border:0}.r span:first-child{color:var(--mu)}
.big{font-size:34px;font-weight:800;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--ac)}.neg{color:var(--bad)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;transition:transform .2s cubic-bezier(.2,1.1,.4,1),opacity .15s}
button:active,[data-a]:active{transform:scale(.95);opacity:.85;transition-duration:.06s}
.b{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 82%,#000));color:var(--on);font-weight:800;border-radius:14px;padding:12px;width:100%;font-size:14px}
.k{background:var(--inn);border:1px solid var(--bd);border-radius:12px;padding:9px 4px;font-weight:700;font-size:12px;min-width:0}.k small{font-size:10px;color:var(--mu);font-weight:600}
.k.on{background:var(--ac);color:var(--on);border-color:transparent}.k.on small{color:var(--on)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:5px;margin-bottom:7px}
.f label{display:block;font-size:11px;color:var(--mu);font-weight:700;margin-bottom:3px}
.st{display:flex;align-items:center;gap:3px;background:var(--inn);border-radius:12px;padding:3px}
.st button{width:30px;height:30px;border-radius:9px;background:var(--card);font-size:17px;flex:0 0 auto}
input,select{font:inherit;font-size:16px;color:var(--tx);background:var(--inn);border:1px solid transparent;border-radius:11px;padding:8px;width:100%;min-width:0;text-align:center;font-weight:700}
.st input{background:none;border:0;padding:4px 0;flex:1}
input:focus,select:focus{outline:0;border-color:var(--ac)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:5px;border-radius:24px;background:var(--gl);border:1px solid var(--bd);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 1px 0 var(--bd),0 12px 30px -10px rgba(0,0,0,.5)}
nav button{background:none;border-radius:19px;padding:6px 0 5px;font-size:9.5px;font-weight:700;color:var(--mu);display:flex;flex-direction:column;gap:1px;align-items:center}
nav button i{font-style:normal;font-size:18px}nav button.on{background:var(--ac);color:var(--on)}
.bars{display:flex;align-items:flex-end;gap:2px;height:60px}.bars div{flex:1;background:var(--inn);border-radius:3px 3px 0 0;min-height:2px}.bars div.top{background:var(--ac)}
.pgb{height:8px;background:var(--inn);border-radius:5px;overflow:hidden;margin:6px 0}.pgb div{height:100%;background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 65%,#fff));border-radius:5px;transition:width .5s}
#ov{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;background:rgba(5,8,12,.5)}
.sh{width:100%;background:var(--gl);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);border:1px solid var(--bd);border-radius:26px 26px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.3,1);max-height:90vh;overflow:auto}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#ts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;z-index:200;display:flex;justify-content:center;pointer-events:none}
.to{background:var(--gl);border:1px solid var(--bd);border-radius:99px;padding:9px 16px;font-weight:700;font-size:13px;max-width:90%;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);animation:up .25s}
.vd{padding:7px 10px;border-radius:12px;font-weight:800;font-size:12px;margin:6px 0}
.vd.vg{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}.vd.vm{background:var(--inn)}.vd.vx{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.hi{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--bd);cursor:pointer}.hi:last-child{border:0}.hi>div{flex:1;min-width:0}.hi small{display:block;color:var(--mu);font-size:11px}
.x{width:30px;height:30px;border-radius:10px;background:var(--inn);color:var(--mu)}
details{border-top:1px solid var(--bd);padding:2px 0}summary{padding:8px 0;font-weight:700;cursor:pointer;font-size:13px}details .g2{margin-bottom:8px}
.page{animation:fin .22s ease}@keyframes fin{from{opacity:0;transform:translateY(4px)}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cd{background:var(--inn);border-radius:10px;padding:5px 0;text-align:center;font-size:13px;font-weight:700;cursor:pointer}.cd small{display:block;font-size:9px;color:var(--mu);font-weight:600}.cd.off{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}.cd.td{outline:2px solid var(--ac)}
.sw{display:flex;gap:12px;justify-content:center}.sw button{width:36px;height:36px;border-radius:50%;border:3px solid var(--bd)}.sw button.on{border-color:var(--tx)}
.fl{animation:flash .55s ease}@keyframes flash{0%{transform:scale(1.08);filter:brightness(1.6)}100%{transform:none;filter:none}}
nav button{position:relative}.bd{position:absolute;top:1px;left:calc(50% + 6px);background:var(--ac);color:var(--on);font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px;min-width:16px}.bd.pop{animation:flash .6s}nav button.on .bd{background:var(--on);color:var(--ac)}
.to{pointer-events:auto}.u{margin-left:10px;background:none;color:var(--ac);font-weight:800}
.warn{font-size:11px;color:var(--mu);margin:-2px 0 7px;line-height:1.4}
</style>
</head>
<body>
<header><div><h1>DriverHub</h1><div class="sub" id="hs"></div></div><button class="x" data-a="theme" style="font-size:15px">🌗</button></header>
<main id="app"></main>
<nav id="nav"></nav><div id="ov"></div><div id="ts"></div>
<input type="file" id="imp" accept=".json" style="display:none">
<script>
const tg=window.Telegram&&Telegram.WebApp;tg&&(tg.expand(),tg.ready());
const $=s=>document.querySelector(s),m=n=>Math.round(n||0).toLocaleString('uk-UA').replace(/[\u00a0\u202f]/g,' ');
const ld=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}},sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const hap=t=>{try{const h=tg.HapticFeedback;t==='s'?h.selectionChanged():t==='ok'?h.notificationOccurred('success'):t==='e'?h.notificationOccurred('error'):h.impactOccurred(t==='m'?'medium':'light')}catch(e){}};
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button,[data-a]');b&&!b.disabled&&hap(b.closest('nav')||b.classList.contains('k')?'s':b.classList.contains('b')?'m':'l')},{passive:true});
const toast=(t,k,a)=>{hap(k==='e'?'e':'ok');$('#ts').innerHTML='<div class="to">'+t+(a?`<button class="u" data-a="${a[0]}" data-v="${a[1]}">${a[2]}</button>`:'')+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#ts').innerHTML='',a?5000:2300)};

/* ===== Дані (ті самі ключі, що й у старому застосунку) ===== */
const K={e:'taxi_expenses_v22',t:'taxi_tariffs_v22',d:'taxi_daily_cash_data_v22',a:'taxi_shift_archive_v1',p:'taxi_platforms_v2',c:'taxi_calc_v2'};
const T=(n,a,b,c,d,e,f)=>({name:n,minPrice:a,minKm:b,perKmCity:c,perKmOut:d,perMin:e,stopPrice:f});
const DT={standard:T('Стандарт',95,1.8,30,45,3.5,10),comfort:T('Комфорт',100,1.8,35,45,4,15),business:T('Бізнес',120,1.5,40,45,5,15),intercity:T('За місто',100,1.5,30,40,4,15)};
const DP=()=>({uklon:{name:'Uklon',comm:17,t:JSON.parse(JSON.stringify(DT))},
 bolt:{name:'Bolt',comm:20,ph:1,t:{econ:T('Економ',90,2,22,28,3,10),comf:T('Комфорт',100,2,26,32,3.5,10)}},
 uber:{name:'Uber',comm:25,ph:1,t:{x:T('UberX',85,2,21,27,3,10),comf:T('Comfort',100,2,25,31,3.5,10)}}});
const E=Object.assign({comm:17,type:'gas',cons:14,price:41.9,amort:0,workMode:'solo',rentVal:0,splitPct:10,taxRate:5,fop:false,warRate:1,esv:1902.34,taxBase:'afterComm',goalKm:40,goalDay:2000,planH:10,accent:'teal',autoReset:true},ld(K.e,{}));
const P=ld(K.p,null)||(()=>{const p=DP();p.uklon.comm=E.comm;Object.assign(p.uklon.t,ld(K.t,{}));return p})();
const C=Object.assign({km:0,kmOut:0,deliv:0,empty:0,wait:0,stops:0,coef:1,tip:0,offer:0,pay:'cash',pl:'uklon',tr:'standard'},ld(K.c,{}));
const S={per:30,po:false};let D,tab='trip';const B=Object.assign({target:700,adj:null,off:[],mon:''},ld('taxi_brand_v2',{}));
const AC={teal:['#4FD1C5','#0E9F94'],indigo:['#8F9DFF','#4A5BD4'],amber:['#FFC85A','#D98E00'],rose:['#FF8FA3','#D6406A'],lime:['#B9E36B','#6A9F12']};
function applyAccent(){const d=document.documentElement.dataset.theme==='dark'?0:1,c=(AC[E.accent]||AC.teal)[d],n=parseInt(c.slice(1),16),l=.299*(n>>16)+.587*(n>>8&255)+.114*(n&255),st=document.documentElement.style;st.setProperty('--ac',c);st.setProperty('--on',l>150?'#14110a':'#fff')}
const savePE=()=>{sv(K.e,E);sv('taxi_brand_v2',B);sv(K.p,P);sv(K.t,P.uklon?P.uklon.t:DT)};
const fixSel=()=>{if(!P[C.pl])C.pl=Object.keys(P)[0];if(!P[C.pl].t[C.tr])C.tr=Object.keys(P[C.pl].t)[0]};
const root={E,P,B},gp=p=>p.split('.').reduce((o,k)=>o[k],root),setPath=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],root)[l]=v};
const today=()=>new Date().toLocaleDateString(),hm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const newDay=()=>({date:today(),orders:0,gross:0,comm:0,fuel:0,extra:0,park:0,tax:0,kmDv:0,totalKm:0,totalCash:0,totalCard:0,tips:0,actualFuel:0,history:[],shiftActive:false,shiftStart:null,shiftAccMs:0,pl:{}});
const norm=d=>{const n=Object.assign(newDay(),d);n.park=d.park??d.rent??0;n.extra=d.extra??d.extraExp??0;n.pl=d.pl||{};return n};
function loadDay(){const d=ld(K.d,null);if(d&&d.date===today()){D=norm(d);return}if(d&&d.orders){D=norm(d);arc()}D=newDay();sv(K.d,D)}
const hrs=()=>((D.shiftAccMs||0)+(D.shiftActive&&D.shiftStart?Date.now()-D.shiftStart:0))/36e5;
const dFuel=()=>D.actualFuel>0?D.actualFuel:D.fuel,dRent=()=>E.workMode==='rent'&&(D.orders>0||D.shiftActive)?+E.rentVal:0;
const dNet=()=>D.gross-D.comm-dFuel()-D.extra-D.park-D.tax-dRent();
function arc(){if(!D.orders)return;const hr=Array(24).fill(0),tr=Array(24).fill(0);D.history.forEach(t=>{if(t.x||t.pay==='expense')return;const h=parseInt(t.time);if(h>=0&&h<24){hr[h]+=t.net;tr[h]++}});
 const rec={date:D.date,orders:D.orders,gross:D.gross,comm:D.comm,fuel:D.fuel,actualFuel:D.actualFuel,tips:D.tips,extraExp:D.extra,rent:D.park+dRent(),tax:D.tax,net:dNet(),totalKm:D.totalKm,totalCash:D.totalCash,totalCard:D.totalCard,shiftHours:hrs(),cancelPct:0,orderMinutes:0,timestamp:Date.now(),hr,tr,pl:D.pl};
 const A=ld(K.a,[]),i=A.findIndex(s=>s.date===D.date);i>-1?A[i]=rec:A.unshift(rec);sv(K.a,A.slice(0,120))}
const save=()=>{sv(K.d,D);clearTimeout(save.t);save.t=setTimeout(arc,700);hdr()};

/* ===== Розрахунок: тарифи, комісія, ФОП, парк, оренда ===== */
const fuelCost=km=>km/100*E.cons*E.price+km*E.amort;
function fin(g,pl,tot){const comm=g*pl.comm/100,fuel=fuelCost(tot),park=E.workMode==='split'?(g-comm)*E.splitPct/100:0,tax=E.fop?(E.taxBase==='gross'?g:g-comm)*(E.taxRate+E.warRate)/100:0,net=g-comm-fuel-park-tax;return{g,comm,fuel,park,tax,net,tot,eff:tot?net/tot:0}}
function calc(t,pl,c){let rem=t.minKm,xc=0,xo=0;if(c.km>=rem){xc=c.km-rem;rem=0}else rem-=c.km;if(c.kmOut>=rem)xo=c.kmOut-rem;
 const g=(t.minPrice+xc*t.perKmCity+xo*t.perKmOut+c.wait*t.perMin+c.stops*t.stopPrice)*c.coef+c.tip;return fin(g,pl,c.km+c.kmOut+c.deliv+c.empty)}
const kf=pl=>{const c=pl.comm/100,s=E.workMode==='split'?E.splitPct/100:0,tr=E.fop?(E.taxRate+E.warRate)/100:0;return(1-c)*(1-s)-(E.taxBase==='gross'?tr:(1-c)*tr)};
function addTrip(r,plk,pay,tip,trip,dv){D.kmDv=(D.kmDv||0)+(dv||0);D.orders++;D.gross+=r.g;D.comm+=r.comm;D.fuel+=r.fuel;D.park+=r.park;D.tax+=r.tax;D.totalKm+=r.tot;D.tips+=tip||0;pay==='cash'?D.totalCash+=r.g:D.totalCard+=r.g;
 const p=D.pl[plk]||(D.pl[plk]={n:0,g:0,net:0});p.n++;p.g+=r.g;p.net+=r.net;const id=Date.now()+Math.random();D.history.unshift({id,time:hm(),pay,pl:plk,g:r.g,net:r.net,km:r.tot,tip:tip||0,trip:trip||0,dv:dv||0,r});save();return id}
function delItem(id){const i=D.history.findIndex(t=>t.id===id);if(i<0)return;const t=D.history[i];
 if(t.x){t.k==='fuel'?D.actualFuel=Math.max(0,D.actualFuel-t.amt):D.extra-=t.amt}else if(t.r){const r=t.r;D.orders--;D.gross-=r.g;D.comm-=r.comm;D.fuel-=r.fuel;D.park-=r.park;D.tax-=r.tax;D.totalKm=Math.max(0,D.totalKm-r.tot);D.kmDv=Math.max(0,(D.kmDv||0)-(t.dv||0));D.tips-=t.tip||0;t.pay==='cash'?D.totalCash-=r.g:D.totalCard-=r.g;const p=D.pl[t.pl];p&&(p.n--,p.g-=r.g,p.net-=r.net)}
 D.history.splice(i,1);save()}

/* ===== Шторки ===== */
function ask(title,fs,ok,sum){return new Promise(res=>{const o=$('#ov');o.style.display='flex';
 o.innerHTML=`<div class="sh"><div class="t">${title}</div>${fs.map((f,i)=>`<div class="f" style="margin-bottom:8px"><label>${f.l}</label>${f.o?`<select id="q${i}">${f.o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select>`:`<input id="q${i}" ${f.t==='s'?'':'type="number" inputmode="decimal"'}>`}</div>`).join('')}${sum?'<div class="r" style="margin-bottom:8px"><span>Разом пробіг</span><b id="qs">0.0 км</b></div>':''}<div class="g2"><button class="k" id="qn" style="padding:12px">Скасувати</button><button class="b" id="qy">${ok||'Готово'}</button></div></div>`;
 fs.forEach((f,i)=>f.v!==undefined&&($('#q'+i).value=f.v));const done=v=>{o.style.display='none';o.innerHTML='';res(v)};$('#qn').onclick=()=>done(null);$('#qy').onclick=()=>done(fs.map((f,i)=>$('#q'+i).value));o.onclick=e=>{e.target===o&&done(null)};sum&&(o.oninput=()=>{$('#qs').textContent=sum(fs.map((f,i)=>$('#q'+i).value))});
 setTimeout(()=>fs.length&&$('#q0').focus(),150)})}

/* ===== Вкладка «Поїздка» ===== */
const F=(id,l,st)=>`<div class="f"><label>${l}</label><div class="st"><button data-a="s" data-v="${id}:-${st}">−</button><input type="number" inputmode="decimal" data-c="${id}" value="${C[id]}"><button data-a="s" data-v="${id}:${st}">+</button></div></div>`;
function vTrip(){const pl=P[C.pl];return`<div class="page"><div class="chips">${Object.keys(pl.t).map(k=>`<button class="k ${k===C.tr?'on':''}" data-a="tr" data-v="${k}">${pl.t[k].name}<br><small>від ${pl.t[k].minPrice} ₴</small></button>`).join('')}</div><div class="sub" style="display:flex;justify-content:space-between;align-items:center;margin:-2px 0 7px"><span>${pl.name} · комісія ${pl.comm}%</span><button class="k" data-a="po" style="padding:5px 10px;font-size:11px">${S.po?'Сховати':'Змінити платформу'} ⌄</button></div>${S.po?`<div class="chips">${Object.keys(P).map(k=>`<button class="k ${k===C.pl?'on':''}" data-a="pl" data-v="${k}">${P[k].name}</button>`).join('')}</div>`:''}
${pl.ph?'<div class="warn">⚠️ Тарифи цієї платформи орієнтовні — виправте їх в «Опціях».</div>':''}
<div class="card"><div class="t"><span>Маршрут</span><button class="k" data-a="clr" style="padding:4px 10px;font-size:11px">Очистити</button></div><div class="g2">${F('km','Км місто',.1)}${F('kmOut','Км за містом',.1)}${F('deliv','Подача, км',.1)}${F('empty','Порожній, км',1)}${F('wait','Очікування, хв',1)}${F('stops','Дод. точки',1)}</div><div class="r" style="margin-top:6px"><span>Разом пробіг (маршрут + подача + порожній)</span><b id="tk">0 км</b></div><button class="k" data-a="mirror" style="width:100%;margin:4px 0 2px;padding:8px">↔ Порожній пробіг = км маршруту</button>
<div class="chips" style="margin:8px 0 6px;grid-template-columns:repeat(4,1fr)">${[1,1.2,1.5,2].map(x=>`<button class="k ${C.coef==x?'on':''}" data-a="cf" data-v="${x}">${x}x</button>`).join('')}</div>
<div class="g2">${F('coef','Коефіцієнт',.1)}${F('tip','Чайові, ₴',5)}</div><div style="margin-top:8px">${F('offer','Ціна замовлення з додатку, ₴ (необов\'язково)',10)}</div></div>
<div id="res"></div><div id="cmp"></div></div>`}
function upTrip(){sv(K.c,C);const pl=P[C.pl],t=pl.t[C.tr];let r=calc(t,pl,C);if(C.offer>0)r=fin(+C.offer,pl,r.tot);
 {const tk=$('#tk');tk&&(tk.textContent=r.tot.toFixed(1)+' км')}

const hdr=()=>{$('#hs').textContent='Сьогодні: '+m(dNet())+' ₴ · '+D.orders+' поїздок'};
function setC(k,v){C[k]=k==='coef'?Math.max(1,Math.round(v*10)/10):Math.max(0,Math.round(v*10)/10);const i=document.querySelector('[data-c="'+k+'"]');i&&(i.value=C[k]);if(k==='coef')document.querySelectorAll('[data-a=cf]').forEach(b=>b.classList.toggle('on',+b.dataset.v===C.coef));upTrip()}
const H={
 tab:v=>{tab=v;show();window.scrollTo(0,0)},theme:()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('taxi_theme',n);applyAccent();try{tg.setHeaderColor(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim())}catch(e){}},
 pl:v=>{S.po=false;C.pl=v;C.tr=Object.keys(P[v].t)[0];sv(K.c,C);show()},tr:v=>{C.tr=v;sv(K.c,C);show()},cf:v=>setC('coef',+v),s:v=>{const[k,s]=v.split(':');setC(k,(+C[k]||0)+ +s)},pay:v=>{C.pay=v;upTrip()},
 pick:v=>{const[a,b]=v.split(':');C.pl=a;C.tr=b;sv(K.c,C);show();window.scrollTo({top:0,behavior:'smooth'})},
 add:()=>{const pl=P[C.pl];let r=calc(pl.t[C.tr],pl,C);if(C.offer>0)r=fin(+C.offer,pl,r.tot);const snap={...C},tid=addTrip(r,C.pl,C.pay,C.tip,C.km+C.kmOut,C.deliv+C.empty);H._snap=snap;if(E.autoReset!==false){['km','kmOut','deliv','empty','wait','stops','tip','offer'].forEach(k=>C[k]=0);C.coef=1;sv(K.c,C)}toast('Записано в «Зміну» · '+m(r.g)+' ₴ → чистими '+m(r.net)+' ₴','ok',['undo',tid,'Скасувати']);show();const b=$('.bd');b&&b.classList.add('pop')},
 undo:v=>{delItem(+v);H._snap&&Object.assign(C,H._snap);sv(K.c,C);$('#ts').innerHTML='';hap('s');show()},mirror:()=>setC('empty',C.km+C.kmOut),
 clr:()=>{['km','kmOut','deliv','empty','wait','stops','tip','offer'].forEach(k=>C[k]=0);C.coef=1;sv(K.c,C);show()},po:()=>{S.po=!S.po;show()},
 shift:()=>{if(D.shiftActive){D.shiftAccMs+=Date.now()-D.shiftStart;D.shiftStart=null;D.shiftActive=false}else{D.shiftActive=true;D.shiftStart=Date.now()}save();show()},
 manual:async()=>{const a=await ask('Поїздка вручну',[{l:'Сума, ₴'},{l:'Км поїздки (з пасажиром)'},{l:'Подача, км (до пасажира)'},{l:'Платформа',o:Object.keys(P).map(k=>[k,P[k].name]),v:C.pl},{l:'Оплата',o:[['cash','Готівка'],['card','Картка']],v:C.pay}],'Додати',v=>((+v[1]||0)+(+v[2]||0)).toFixed(1)+' км');if(!a||!(+a[0]>0))return;const tr=+a[1]||0,dv=+a[2]||0;addTrip(fin(+a[0],P[a[3]],tr+dv),a[3],a[4],0,tr,dv);toast('Додано · пробіг '+tr.toFixed(1)+(dv?' + '+dv.toFixed(1)+' = '+(tr+dv).toFixed(1):'')+' км');show()},
 fuel:async()=>{const a=await ask('Заправка',[{l:'Скільки залили, ₴'}]);if(!a||!(+a[0]>0))return;D.actualFuel+=+a[0];D.history.unshift({id:Date.now(),x:1,k:'fuel',name:'⛽ Заправка',amt:+a[0],time:hm()});save();show()},
 exp:async()=>{const a=await ask('Витрата',[{l:'Назва (мийка, їжа…)',t:'s'},{l:'Сума, ₴'}]);if(!a||!(+a[1]>0))return;D.extra+=+a[1];D.history.unshift({id:Date.now(),x:1,k:'extra',name:'💸 '+(a[0]||'Витрата').replace(/[<>&]/g,''),amt:+a[1],time:hm()});save();show()},
 del:async v=>{if(await ask('Видалити запис?',[],'Видалити')){delItem(+v);show()}},
 end:async()=>{if(!await ask('Зміну буде збережено в архів і обнулено.',[],'Завершити'))return;arc();D=newDay();sv(K.d,D);toast('Зміну завершено');show()},
 per:v=>{S.per=+v;show()},
 set:v=>{const i=v.lastIndexOf(':'),p=v.slice(0,i),x=v.slice(i+1);setPath(p,x==='true'?true:x==='false'?false:x);savePE();show()},
 addtr:v=>{P[v].t['t'+Date.now()]=T('Новий тариф',90,1.5,25,35,3,10);savePE();show()},
 deltr:v=>{const[a,b]=v.split(':');if(Object.keys(P[a].t).length<2)return toast('Лишіть хоча б один тариф','e');delete P[a].t[b];savePE();show()},
 delpl:async v=>{if(Object.keys(P).length<2)return toast('Лишіть хоча б одну платформу','e');if(!await ask('Видалити «'+P[v].name+'» з усіма тарифами?',[],'Видалити'))return;delete P[v];savePE();show()},
 addpl:async()=>{const a=await ask('Нова платформа',[{l:'Назва',t:'s'},{l:'Комісія, %'}]);if(!a||!a[0].trim())return;P['p'+Date.now()]={name:a[0].trim().slice(0,20).replace(/[<>&]/g,''),comm:+a[1]||20,t:{s:T('Стандарт',90,1.5,25,35,3,10)}};savePE();show()},
 reset:async()=>{if(!await ask('Тарифи й платформи повернуться до стандартних.',[],'Скинути'))return;Object.keys(P).forEach(k=>delete P[k]);Object.assign(P,DP());savePE();show()},
 acc:v=>{E.accent=v;savePE();applyAccent();show()},day:v=>{const d=+v,i=B.off.indexOf(d);i>-1?B.off.splice(i,1):B.off.push(d);savePE();show()},
 exp2:()=>{const b=new Blob([JSON.stringify({v:4,E,P,A:ld(K.a,[]),D})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='DriverHub_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Копію збережено')},
 imp:()=>$('#imp').click(),
 share:()=>{const A=ld(K.a,[]),L=A.filter(s=>!S.per||Date.now()-s.timestamp<S.per*864e5),n=L.reduce((a,s)=>a+s.net,0),g=L.reduce((a,s)=>a+s.gross,0),km=L.reduce((a,s)=>a+s.totalKm,0),o=L.reduce((a,s)=>a+s.orders,0);
  const t=`📊 DriverHub · ${S.per?S.per+' днів':'весь час'}\n✅ Поїздок: ${o}\n📍 Пробіг: ${km.toFixed(0)} км\n💵 Оборот: ${m(g)} ₴\n💰 Чисті: ${m(n)} ₴`;navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Звіт скопійовано')):toast('Копіювання недоступне','e')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');b&&H[b.dataset.a]&&H[b.dataset.a](b.dataset.v,b)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.c){C[t.dataset.c]=parseFloat(t.value)||0;upTrip()}else if(t.dataset.k&&t.tagName==='INPUT'){setPath(t.dataset.k,t.dataset.ty==='s'?t.value:(parseFloat(t.value)||0));savePE();tab==='brand'&&$('#bres')&&($('#bres').innerHTML=bRes())}});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.k){setPath(t.dataset.k,t.value);savePE()}});
$('#imp').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text()),ex=o.E||o.expenses,a=o.A||o.shiftArchive;if(!ex&&!a)throw 0;ex&&sv(K.e,ex);if(o.P)sv(K.p,o.P);else if(o.tariffs){sv(K.t,o.tariffs);localStorage.removeItem(K.p)}a&&sv(K.a,a);(o.D||o.dailyCashData)&&sv(K.d,o.D||o.dailyCashData);toast('Відновлено');setTimeout(()=>location.reload(),600)}catch(x){toast('Не вдалось прочитати файл','e')}};
document.addEventListener('keydown',e=>{e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.blur()});
setInterval(()=>{if(tab==='shift'&&$('#hero')&&D.shiftActive)$('#hero').innerHTML=heroH()},30000);
document.documentElement.dataset.theme=localStorage.getItem('taxi_theme')||'dark';applyAccent();
loadDay();brandInit();fixSel();show();
